<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('{{ url_for('static', filename='background.jpg') }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            max-width: 600px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.9);
        }
        .result {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .result.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="text-center">Spam Message Detector</h2>
        <form action="/predict" method="post">
            <div class="mb-3">
                <label for="message" class="form-label">Enter your message:</label>
                <textarea class="form-control" id="message" name="message" rows="3" required oninput="updateWordCount()"></textarea>
                <small id="wordCount" class="form-text text-muted">Word Count: 0</small>
            </div>
            <button type="submit" class="btn btn-primary w-100">Check Spam</button>
        </form>

        {% if predictions %}
        <div class="mt-4 result show">
            <h4>Prediction Results:</h4>
            <ul class="list-group">
                <li class="list-group-item"><strong>Naïve Bayes:</strong> {{ predictions['Naive Bayes'] }}</li>
                <li class="list-group-item"><strong>Logistic Regression:</strong> {{ predictions['Logistic Regression'] }}</li>
                <li class="list-group-item"><strong>Random Forest:</strong> {{ predictions['Random Forest'] }}</li>
            </ul>
        </div>
        {% endif %}
    </div>
</div>

<script>
    function updateWordCount() {
        let text = document.getElementById("message").value;
        let words = text.trim().split(/\s+/).filter(word => word.length > 0);
        document.getElementById("wordCount").innerText = "Word Count: " + words.length;
    }
</script>

</body>
</html>
