<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusIQ | Spam Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            /* Using a high-quality tech gradient as fallback for the background image */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%), 
                        url('{{ url_for('static', filename='background.jpg') }}') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 650px;
            padding: 20px;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
        }

        .btn-check-spam {
            background: #00d2ff;
            background: -webkit-linear-gradient(to right, #3a7bd5, #00d2ff);
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-check-spam:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        /* Result Styling */
        .result-box {
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin-top: 25px;
            animation: fadeIn 0.8s ease;
        }

        .spam-text { color: #ff4d4d; font-weight: bold; }
        .ham-text { color: #2ecc71; font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loading { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-virus fa-3x mb-3 text-info"></i>
            <h2 class="fw-bold">Spam Guard AI</h2>
            <p class="text-light-50">Advanced multi-model message analysis</p>
        </div>

        <form action="/predict" method="post" id="spamForm">
            <div class="mb-3">
                <label for="message" class="form-label text-light">Paste your message below:</label>
                <textarea class="form-control" id="message" name="message" rows="4" 
                    placeholder="Type or paste suspicious text here..." 
                    required oninput="updateWordCount()"></textarea>
                <div class="d-flex justify-content-between mt-2">
                    <small id="wordCount" class="text-light">Words: 0</small>
                    <small class="text-light-50">Powered by CampusIQ</small>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-check-spam w-100" id="submitBtn">
                <span id="btnText"><i class="fas fa-search me-2"></i>Analyze Message</span>
                <span id="loading" class="spinner-border spinner-border-sm" role="status"></span>
            </button>
        </form>

        {% if predictions %}
        <div class="result-box">
            <h5 class="mb-3 border-bottom pb-2"><i class="fas fa-poll-h me-2"></i>Analysis Results:</h5>
            <div class="row g-3">
                {% for model, result in predictions.items() %}
                <div class="col-12 d-flex justify-content-between align-items-center bg-white bg-opacity-10 p-2 rounded px-3">
                    <span>{{ model }}</span>
                    <span class="{{ 'spam-text' if 'Spam' in result else 'ham-text' }}">
                        <i class="fas {{ 'fa-circle-exclamation' if 'Spam' in result else 'fa-circle-check' }} me-1"></i>
                        {{ result }}
                    </span>
                </div>
                {% endfor %}
            </div>
            <div class="text-center mt-3">
                <a href="/" class="btn btn-sm btn-outline-light opacity-50">Clear Results</a>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<script>
    // Update word count in real-time
    function updateWordCount() {
        let text = document.getElementById("message").value;
        let words = text.trim().split(/\s+/).filter(word => word.length > 0);
        document.getElementById("wordCount").innerText = "Words: " + words.length;
    }

    // Show loading spinner on click
    document.getElementById("spamForm").onsubmit = function() {
        document.getElementById("btnText").style.display = "none";
        document.getElementById("loading").style.display = "inline-block";
        document.getElementById("submitBtn").disabled = true;
    };
</script>

</body>
</html>
